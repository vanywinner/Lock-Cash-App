<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin · Lock Cash</title>
  <meta name="theme-color" content="#0f5c43">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap wide">
      <a class="brand" href="admin.html"><img src="icons/logo.svg" alt="" width="30" height="30">Lock Cash <span class="pill">Admin</span></a>
      <div class="row">
        <a class="btn ghost small" id="btn-export" href="api/admin/export/transactions.csv" download>Export CSV</a>

    <div class="wrap wide stack">

      <div class="tabs" role="tablist" id="tabs" aria-label="Admin sections"></div>
      <section id="panel" role="tabpanel" aria-live="polite"></section>

  <div id="site-footer"></div>
  <dialog id="dlg"></dialog>
  <script type="module" src="js/admin.js"></script>
